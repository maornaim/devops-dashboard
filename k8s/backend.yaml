apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec: 
      nodeSelector:
        workload: application
      containers:
        - name: backend-container
          image: nginx:1.27-alpine
          command: ["/bin/sh", "-c"]
          args:
            - echo "$MESSAGE" > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MESSAGE
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DEMO_PASSWORD
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
              

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80